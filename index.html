<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .calculator {
            background: #2d2d2d;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            width: 320px;
        }

        .display {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 10px;
            text-align: right;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            word-wrap: break-word;
            overflow: hidden;
        }

        .display .expression {
            color: #888;
            font-size: 16px;
            min-height: 24px;
        }

        .display .result {
            color: #fff;
            font-size: 36px;
            font-weight: bold;
            min-height: 44px;
        }

        .history {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 8px 20px;
            margin-bottom: 15px;
            max-height: 72px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #4a4a4a transparent;
        }

        .history::-webkit-scrollbar {
            width: 4px;
        }

        .history::-webkit-scrollbar-thumb {
            background: #4a4a4a;
            border-radius: 4px;
        }

        .history-item {
            color: #666;
            font-size: 13px;
            text-align: right;
            padding: 2px 0;
            border-bottom: 1px solid #2a2a2a;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 18px;
            font-size: 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        button:active {
            transform: scale(0.95);
        }

        .number {
            background: #4a4a4a;
            color: #fff;
        }

        .number:hover {
            background: #5a5a5a;
        }

        .operator {
            background: #f39c12;
            color: #fff;
        }

        .operator:hover {
            background: #e67e22;
        }

        .equals {
            background: #2ecc71;
            color: #fff;
            grid-column: span 2;
        }

        .equals:hover {
            background: #27ae60;
        }

        .clear {
            background: #e74c3c;
            color: #fff;
        }

        .clear:hover {
            background: #c0392b;
        }

        .backspace {
            background: #95a5a6;
            color: #fff;
        }

        .backspace:hover {
            background: #7f8c8d;
        }

        .decimal {
            background: #4a4a4a;
            color: #fff;
        }

        .decimal:hover {
            background: #5a5a5a;
        }

        .zero {
            grid-column: span 2;
        }

        .unary {
            background: #3498db;
            color: #fff;
        }

        .unary:hover {
            background: #2980b9;
        }

        .memory-btn {
            background: #9b59b6;
            color: #fff;
            font-size: 12px;
            padding: 10px;
        }

        .memory-btn:hover {
            background: #8e44ad;
        }

        .memory-indicator {
            color: #9b59b6;
            font-size: 12px;
            text-align: left;
            min-height: 18px;
            padding: 2px 0;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="memory-indicator" id="memoryIndicator"></div>
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
        </div>
        <div class="history" id="history"></div>
        <div class="buttons">
            <button class="memory-btn" onclick="memoryClear()">MC</button>
            <button class="memory-btn" onclick="memoryRecall()">MR</button>
            <button class="memory-btn" onclick="memoryAdd()">M+</button>
            <button class="memory-btn" onclick="memorySubtract()">M−</button>

            <button class="clear" onclick="clearAll()">C</button>
            <button class="backspace" onclick="backspace()">⌫</button>
            <button class="unary" onclick="toggleSign()">±</button>
            <button class="operator" onclick="appendOperator('/')">÷</button>

            <button class="number" onclick="appendNumber('7')">7</button>
            <button class="number" onclick="appendNumber('8')">8</button>
            <button class="number" onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="appendOperator('*')">×</button>

            <button class="number" onclick="appendNumber('4')">4</button>
            <button class="number" onclick="appendNumber('5')">5</button>
            <button class="number" onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="appendOperator('-')">−</button>

            <button class="number" onclick="appendNumber('1')">1</button>
            <button class="number" onclick="appendNumber('2')">2</button>
            <button class="number" onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="appendOperator('+')">+</button>

            <button class="number zero" onclick="appendNumber('0')">0</button>
            <button class="decimal" onclick="appendDecimal()">.</button>
            <button class="equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let expression = '';
        let result = '0';
        let shouldResetResult = false;
        let memory = null;
        let historyEntries = [];
        const MAX_HISTORY = 5;

        const expressionEl = document.getElementById('expression');
        const resultEl = document.getElementById('result');
        const historyEl = document.getElementById('history');
        const memoryIndicator = document.getElementById('memoryIndicator');

        function updateDisplay() {
            expressionEl.textContent = expression;
            resultEl.textContent = result;
            memoryIndicator.textContent = memory !== null ? 'M' : '';
        }

        function addHistory(entry) {
            historyEntries.unshift(entry);
            if (historyEntries.length > MAX_HISTORY) historyEntries.pop();
            renderHistory();
        }

        function renderHistory() {
            historyEl.innerHTML = historyEntries.map(e =>
                `<div class="history-item">${e}</div>`
            ).join('');
        }

        function appendNumber(num) {
            if (shouldResetResult) {
                result = '';
                shouldResetResult = false;
            }
            if (result === '0' && num !== '.') {
                result = num;
            } else {
                result += num;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (expression !== '') {
                calculate();
            }
            shouldResetResult = true;
            expression = result + ' ' + op + ' ';
            updateDisplay();
        }

        function appendDecimal() {
            if (shouldResetResult) {
                result = '0';
                shouldResetResult = false;
            }
            if (!result.includes('.')) {
                result += '.';
            }
            updateDisplay();
        }

        function toggleSign() {
            if (result === '0') return;
            if (result.startsWith('-')) {
                result = result.slice(1);
            } else {
                result = '-' + result;
            }
            updateDisplay();
        }

        function calculate() {
            if (expression === '') return;
            const parts = expression.split(' ');
            if (parts.length !== 3) return;
            const a = parseFloat(parts[0]);
            const op = parts[1];
            const b = parseFloat(result);
            let calcResult;

            switch (op) {
                case '+':
                    calcResult = a + b;
                    break;
                case '-':
                    calcResult = a - b;
                    break;
                case '*':
                    calcResult = a * b;
                    break;
                case '/':
                    if (b === 0) {
                        result = 'Error';
                        expression = '';
                        updateDisplay();
                        return;
                    }
                    calcResult = a / b;
                    break;
                case '%':
                    calcResult = a % b;
                    break;
                default:
                    return;
            }

            const formattedResult = Number.isInteger(calcResult) ? calcResult.toString() : calcResult.toFixed(6).replace(/\.?0+$/, '');
            const formattedA = Number.isInteger(a) ? a.toString() : a.toFixed(6).replace(/\.?0+$/, '');
            const formattedB = Number.isInteger(b) ? b.toString() : b.toFixed(6).replace(/\.?0+$/, '');
            addHistory(`${formattedA} ${op} ${formattedB} = ${formattedResult}`);

            result = formattedResult;
            expression = '';
            shouldResetResult = true;
            updateDisplay();
        }

        function clearAll() {
            expression = '';
            result = '0';
            shouldResetResult = false;
            updateDisplay();
        }

        function backspace() {
            if (result.length > 1) {
                result = result.slice(0, -1);
            } else {
                result = '0';
            }
            updateDisplay();
        }

        // Memory functions
        function memoryClear() {
            memory = null;
            updateDisplay();
        }

        function memoryRecall() {
            if (memory !== null) {
                if (shouldResetResult) {
                    shouldResetResult = false;
                }
                result = memory.toString();
                updateDisplay();
            }
        }

        function memoryAdd() {
            const val = parseFloat(result);
            if (!isNaN(val)) {
                memory = (memory || 0) + val;
                shouldResetResult = true;
                updateDisplay();
            }
        }

        function memorySubtract() {
            const val = parseFloat(result);
            if (!isNaN(val)) {
                memory = (memory || 0) - val;
                shouldResetResult = true;
                updateDisplay();
            }
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                appendNumber(e.key);
            } else if (e.key === '.') {
                appendDecimal();
            } else if (e.key === '+' || e.key === '-') {
                appendOperator(e.key);
            } else if (e.key === '*') {
                appendOperator('*');
            } else if (e.key === '/') {
                e.preventDefault();
                appendOperator('/');
            } else if (e.key === '%') {
                appendOperator('%');
            } else if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                calculate();
            } else if (e.key === 'Backspace') {
                backspace();
            } else if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') {
                clearAll();
            }
        });

        updateDisplay();
    </script>
</body>
</html>
